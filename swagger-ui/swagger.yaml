openapi: 3.0.1
info:
  title: "Book_info_2.0"
  description: "Endpoint проекта book_info"
  version: "1.0"
  contact:
    name: "korytkosergei28@gmail.com"
    email: "korytkosergei28@gmail.com"

servers:
  - url: http://127.0.0.1:5000/
    description: "Локальный сервер"
  - url: https://localhost:5000/
    description: "Тоже локальный сервер, но с HTTPS + сразу место для будущего сервера"

security:
  - BearerAuth: []

paths:
  /books/{book_id}:
    get:
      tags:
        - "BOOKS"
      summary: "Получение книги по ID"
      description: "Доступ к книгам, которые содержит база данных. Книги можно искать по ID."
      operationId: GetBooksId
      parameters:
        - name: book_id
          in: path
          description: "**ID книги**. *Пример: 45*. ID книги, которую вы хотите получить. ID книги можно найти в базе данных book_info_db, схема shelf, таблица book"
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  Дата издания:
                    type: number
                    description: "Формат даты — просто год, например 2023"
                    example: 2023
                  Жанр:
                    type: string
                    description: "Жанр книги, например: Фантастика"
                    example: Фантастика
                  Издательство:
                    type: string
                    description: "Издательство книги, например: Эксмо"
                    example: Эксмо
                  Название:
                    type: string
                    description: "Название книги, например: Колобок"
                    example: Колобок
                  Нахождение:
                    type: string
                    description: "Где находится книга. Возможно два состояния: На руках или В библиотеке"
                    example: На руках
                  Работник библиотеки:
                    type: string
                    description: "Работник библиотеки, который выдал книгу. Например: Иванов Иван Иванович. Также может быть значение 'Ни кем не выдавалась', если книга не выдана"
                    example: Иванов Иван Иванович
                  ФИО Автора:
                    type: string
                    description: "ФИО автора книги. Например: Пушкин Александр Сергеевич"
                    example: Пушкин Александр Сергеевич
                  Язык:
                    type: string
                    description: "Язык книги. Например: Русский"
                    example: Русский
        "404":
          description: Книга не найдена
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: "Книга не найдена"
    
    put:
      tags:
        - "BOOKS"
      summary: Обновление информации о книге
      description: Обновляет значения в базе данных по указанной книге.
      parameters:
        - name: book_id
          in: path
          required: true
          description: Уникальный идентификатор книги
          schema:
            type: integer
            example: 4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                book_name:
                  type: string
                  example: Тракторист Иван
                date_publish:
                  type: integer
                  example: 1999
                language:
                  type: integer
                  description: ID языка из таблицы `shelf.lang`
                  example: 5
                publish:
                  type: integer
                  description: ID издательства из таблицы `shelf.publish`
                  example: 30
                writer:
                  type: integer
                  description: ID писателя из таблицы `shelf.writers`
                  example: 309
                genre:
                  type: integer
                  description: ID жанра из таблицы `shelf.genre`
                  example: 5
              required:
                - book_name
                - date_publish
                - language
                - publish
                - writer
                - genre
      responses:
        '200':
          description: Книга успешно обновлена
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Книга успешно обновлена
                  book:
                    type: object
                    properties:
                      book_id:
                        type: integer
                        example: 4
                      book_name:
                        type: string
                        example: Тракторист Иван
                      date_publish:
                        type: integer
                        example: 1999
                      genre:
                        type: integer
                        example: 5
                      language:
                        type: integer
                        example: 5
                      publish:
                        type: integer
                        example: 30
                      writer:
                        type: integer
                        example: 309
        '404':
          description: Книга не найдена
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Книга не найдена
        '401':
          description: Не авторизован
    delete:
      tags:
        - "BOOKS"
      summary: Удаление книги по ID
      description: Удаляет из БД конкретную книгу. Запрос осуществляется только по `book_id`.
      parameters:
        - name: book_id
          in: path
          required: true
          schema:
            type: integer
          description: Уникальный идентификатор книги
      responses:
        '200':
          description: Книга успешно удалена
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Книга успешно удалена
        '404':
          description: Книга не найдена
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Книга не найдена
        '400':
          description: Общая ошибка (на стороне клиента или сервера)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Произошла ошибка при удалении книги
        '401':
          description: Не авторизован
  /books:  
    post:
      tags:
        - "BOOKS"
      summary: Добавление новой книги
      description: Добавляет в базу данных книгу.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                book_name:
                  type: string
                  example: Маями Хит
                date_publish:
                  type: integer
                  example: 1974
                language:
                  type: integer
                  description: ID языка из таблицы `shelf.lang`
                  example: 18
                publish:
                  type: integer
                  description: ID издательства из таблицы `shelf.publish`
                  example: 18
                writer:
                  type: integer
                  description: ID автора из таблицы `shelf.writers`
                  example: 200
                genre:
                  type: integer
                  description: ID жанра из таблицы `shelf.genre`
                  example: 13
              required:
                - book_name
                - date_publish
                - language
                - publish
                - writer
                - genre
      responses:
        '201':
          description: Книга успешно добавлена
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Книга добавлена
                  book_info:
                    type: object
                    properties:
                      book_id:
                        type: integer
                        example: 207
                      book_name:
                        type: string
                        example: Маями Хит
                      date_publish:
                        type: integer
                        example: 1974
                      genre:
                        type: integer
                        example: 13
                      language:
                        type: integer
                        example: 18
                      publish:
                        type: integer
                        example: 18
                      writer:
                        type: integer
                        example: 200
        '400':
          description: Ошибка на стороне клиента или сервера
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Ошибка добавления книги
        '401':
          description: Не авторизован
  /readers:
    get:
      summary: Список читателей
      description: >
        Возвращает список читателей с возможностью фильтрации по имени, абонементу,
        статусу, дате рождения, количеству книг, телефону и email.
        В имени вместо пробела используется подчёркивание `_`.
      tags:
        - "READERS"
      parameters:
        - name: reader
          in: query
          description: Фильтр по ФИО (через подчёркивание вместо пробела)
          required: false
          schema:
            type: string
          example: Захарова_Ольга_Ивановна

        - name: aboniment
          in: query
          description: Фильтр по абонементу
          required: false
          schema:
            type: integer
          example: 74185296

        - name: is_active
          in: query
          description: Фильтр по статусу активности (true или false)
          required: false
          schema:
            type: boolean
          example: true

        - name: birth_date_from
          in: query
          description: Дата рождения от (формат YYYY-MM-DD)
          required: false
          schema:
            type: string
            format: date
          example: 1987-04-14

        - name: birth_date_to
          in: query
          description: Дата рождения до (формат YYYY-MM-DD)
          required: false
          schema:
            type: string
            format: date
          example: 1987-04-14

        - name: phone_number
          in: query
          description: Фильтр по номеру телефона
          required: false
          schema:
            type: string
          example: "+79234567890"

        - name: email
          in: query
          description: Фильтр по email
          required: false
          schema:
            type: string
            format: email
          example: maria.sid@gmail.com

        - name: min_books
          in: query
          description: Минимальное количество книг на руках
          required: false
          schema:
            type: integer
          example: 2

        - name: max_books
          in: query
          description: Максимальное количество книг на руках
          required: false
          schema:
            type: integer
          example: 3

      responses:
        '200':
          description: Список читателей
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    email:
                      type: string
                      format: email
                    Абонимент:
                      type: integer
                    Адрес:
                      type: string
                    Дата рождения:
                      type: string
                      example: "Sat, 15 Jul 1995 00:00:00 GMT"
                    Действителен абонимент?:
                      type: boolean
                    Книги на руках:
                      type: string
                      description: Список книг в виде строки
                    Номер телефона:
                      type: string
                    ФИО Читателя:
                      type: string
        '401':
          description: Неавторизован (отсутствует или неверный токен)
        '500':
          description: Внутренняя ошибка сервера
    post:
      summary: Добавить нового читателя
      description: Добавляет нового читателя в систему
      tags:
        - "READERS"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - surname
                - name
                - second_name
                - aboniment
                - active_aboniment
                - birth_date
                - phone_number
                - email
                - address
              properties:
                surname:
                  type: string
                  example: Корытко
                name:
                  type: string
                  example: Алексей
                second_name:
                  type: string
                  example: Сергеевич
                aboniment:
                  type: integer
                  format: int64
                  example: 45168254
                active_aboniment:
                  type: boolean
                  example: true
                birth_date:
                  type: string
                  format: date
                  example: 1990-05-12
                phone_number:
                  type: string
                  example: "+79876853210"
                email:
                  type: string
                  format: email
                  example: ivanqov.alex@mail.ru
                address:
                  type: string
                  example: Казань, ул. Баумана, д. 3
      responses:
        '201':
          description: Читатель добавлен
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Читатель добавлен
        '400':
          description: Ошибка общего типа
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Неверные данные
        '401':
          description: Неавторизован (отсутствует или неверный токен)
  /readers/{reader_id}:
    put:
      summary: Обновить информацию о читателе
      description: Меняет информацию по конкретному читателю
      tags:
        - "READERS"
      parameters:
        - name: reader_id
          in: path
          required: true
          schema:
            type: integer
          description: Уникальный идентификатор читателя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - surname
                - name
                - second_name
                - aboniment
                - active_aboniment
                - birth_date
                - phone_number
                - email
                - address
              properties:
                surname:
                  type: string
                  example: Корытко
                name:
                  type: string
                  example: Алексей
                second_name:
                  type: string
                  example: Сергеевич
                aboniment:
                  type: integer
                  format: int64
                  example: 45168254
                active_aboniment:
                  type: boolean
                  example: true
                birth_date:
                  type: string
                  format: date
                  example: 1990-05-12
                phone_number:
                  type: string
                  example: "+79876853210"
                email:
                  type: string
                  format: email
                  example: ivanqov.alex@mail.ru
                address:
                  type: string
                  example: Казань, ул. Баумана, д. 3
      responses:
        '200':
          description: Читатель успешно обновлён
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Читатель успешно обновлён
                  reader:
                    type: object
                    properties:
                      reader_id:
                        type: integer
                        example: 7
                      name:
                        type: string
                        example: Алексей
                      surname:
                        type: string
                        example: Корытко
                      second_name:
                        type: string
                        example: Сергеевич
                      aboniment:
                        type: integer
                        example: 45168254
                      active_aboniment:
                        type: boolean
                        example: true
                      birth_date:
                        type: string
                        example: Sat, 12 May 1990 00:00:00 GMT
                      phone_number:
                        type: string
                        example: "+79876853210"
                      email:
                        type: string
                        example: ivanqov.alex@mail.ru
                      address:
                        type: string
                        example: Казань, ул. Баумана, д. 3
                      registration_date:
                        type: string
                        example: Mon, 24 Mar 2025 17:00:15 GMT
        '400':
          description: Ошибка общего типа
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Неверные данные
        '404':
          description: Читатель не найден
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Читатель с ID 7 не найден
        '401':
          description: Неавторизован (отсутствует или неверный токен)
  /workers:
    get:
      summary: Получить список сотрудников
      description: >
        Возвращает информацию по сотрудникам библиотеки.  
        Можно фильтровать по имени (`worker_name`), статусу (`status`), id (`worker_id`) и должности (`role`).
        Примечание: пробелы в `worker_name` заменяются на подчёркивания (`_`).
      tags:
        - "WORKERS"
      parameters:
        - name: worker_id
          in: query
          required: false
          schema:
            type: integer
          description: ID работника
        - name: worker_name
          in: query
          required: false
          schema:
            type: string
            example: Иванов_Иван_Алексеевич
          description: ФИО сотрудника с подчёркиваниями вместо пробелов
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [Работает, Уволен, Отпуск, Больничный]
            example: Уволен
          description: Статус сотрудника
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [Старший библиотекарь, Младший библиотекарь, Директор, Стажер]
            example: Стажер
          description: Роль сотрудника
      responses:
        '200':
          description: Успешный ответ. Список сотрудников.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    worker_id:
                      type: integer
                      example: 30
                    birth_date:
                      type: string
                      example: Tue, 11 Oct 1988 00:00:00 GMT
                    phone_number:
                      type: string
                      example: "789641256"
                    email:
                      type: string
                      format: email
                      example: filatov@example.com
                    address:
                      type: string
                      example: г. Тверь
                    role:
                      type: string
                      example: Стажер
                    status:
                      type: string
                      example: Отпуск
                    ФИО Сотрудника:
                      type: string
                      example: Филатов Константин Игоревич
        '401':
          description: Неавторизован (требуется токен)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Токен не предоставлен или недействителен
  /workers/{worker_id}:
    put:
      summary: Обновление информации о работнике
      description: >
        Обновляет информацию о работнике библиотеки по его `worker_id`.
        Требует авторизацию через Bearer токен.
      tags:
        - "WORKERS"
      parameters:
        - name: worker_id
          in: path
          required: true
          description: ID сотрудника
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - surname
                - name
                - second_name
                - role
                - status
                - birth_date
                - phone_number
                - email
                - address
              properties:
                surname:
                  type: string
                  example: Собакин
                name:
                  type: string
                  example: Иван
                second_name:
                  type: string
                  example: Дмитриевич
                role:
                  type: integer
                  example: 3
                  description: ID роли сотрудника из таблицы `roles`
                status:
                  type: integer
                  example: 3
                  description: ID статуса сотрудника из таблицы `status`
                birth_date:
                  type: string
                  format: date
                  example: 1997-02-21
                phone_number:
                  type: string
                  example: +773241564589
                email:
                  type: string
                  format: email
                  example: dfghj@fghj.com
                address:
                  type: string
                  example: dfghjklfghj,fgbnm
      responses:
        '200':
          description: Работник успешно обновлён
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Работник успешно обновлён
                  worker:
                    type: object
                    properties:
                      worker_id:
                        type: integer
                        example: 32
                      surname:
                        type: string
                        example: Собакин
                      name:
                        type: string
                        example: Иван
                      second_name:
                        type: string
                        example: Дмитриевич
                      role:
                        type: integer
                        example: 3
                      status:
                        type: integer
                        example: 3
                      birth_date:
                        type: string
                        example: Fri, 21 Feb 1997 00:00:00 GMT
                      phone_number:
                        type: string
                        example: +773241564589
                      email:
                        type: string
                        example: dfghj@fghj.com
                      address:
                        type: string
                        example: dfghjklfghj,fgbnm
        '400':
          description: Ошибка запроса
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Неверный формат запроса или отсутствуют обязательные поля
        '404':
          description: Работник не найден
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Работник с указанным ID не найден
  /writers:
    get:
      summary: Получение информации о писателях
      description: >
        Получает список писателей, либо информацию о конкретном писателе по параметрам фильтрации.
        Может возвращать один, несколько или ноль объектов в зависимости от запроса.
        Требуется авторизация через Bearer токен.
      tags:
        - "WRITERS"
      parameters:
        - name: writer_id
          in: query
          description: ID писателя из таблицы `writers`
          schema:
            type: integer
          example: 168
        - name: writer_name
          in: query
          description: ФИО писателя. Поддерживает частичное совпадение.
          schema:
            type: string
          example: Булгаков
        - name: book
          in: query
          description: Название книги
          schema:
            type: string
          example: Колобок
        - name: nation
          in: query
          description: Страна рождения писателя
          schema:
            type: string
          example: Япония
        - name: only_without_books
          in: query
          description: Фильтр писателей без книг. `true` — только без книг, `false` — все
          schema:
            type: boolean
          example: true
      responses:
        '200':
          description: Список писателей
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    writer_id:
                      type: integer
                      example: 200
                    FIO:
                      type: string
                      example: Гейне Генрих Неизвестно
                    birth_date:
                      type: string
                      format: date-time
                      example: Wed, 13 Dec 1797 00:00:00 GMT
                    books_name:
                      type: string
                      example: Книга 127, Книга 199, Король говорит
                    country:
                      type: string
                      example: Германия
                    info:
                      type: string
                      example: Известный писатель.
        '400':
          description: Ошибка в параметрах запроса
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Некорректные параметры запроса
